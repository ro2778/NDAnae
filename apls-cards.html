<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>APLS Flip Cards — ND Anaesthetics</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root[data-theme="dark"] {
  --bg: #0a0a0a; --bg2: #1a1a1a; --bg3: #222; --text: #e0e0e0; --text2: #aaa;
  --text3: #666; --border: #333; --accent: #7ab5e8; --gold: #ffd700;
  --red: #e74c3c; --green: #27ae60; --shadow: rgba(0,0,0,0.4);
}
:root[data-theme="light"] {
  --bg: #f0f2f5; --bg2: #ffffff; --bg3: #f8fafc; --text: #1a1a2e; --text2: #555;
  --text3: #999; --border: #ddd; --accent: #2b6cb0; --gold: #b8860b;
  --red: #c0392b; --green: #1e8449; --shadow: rgba(0,0,0,0.08);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100dvh;
}
.container { max-width: 600px; margin: 0 auto; padding: 12px 12px 32px; }
.header { display: flex; align-items: center; justify-content: center; position: relative; padding: 8px 44px 4px; }
h1 { font-size: 18px; color: var(--accent); }
.back-link {
  position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
  font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 6px;
}
.sub { text-align: center; font-size: 11px; color: var(--text3); margin-bottom: 12px; }

/* Deck chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip {
  padding: 7px 12px; border-radius: 16px; border: 1px solid var(--border);
  background: var(--bg2); color: var(--text2); font-size: 12px; font-weight: 600; cursor: pointer;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .n { opacity: 0.7; font-weight: 400; margin-left: 3px; }

/* Progress */
.progress-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.bar { height: 6px; border-radius: 3px; background: var(--bg3); border: 1px solid var(--border); overflow: hidden; margin-bottom: 12px; }
.bar-fill { height: 100%; width: 0; background: var(--green); transition: width 0.3s; }

/* Card */
.card { cursor: pointer; user-select: none; -webkit-user-select: none; }
.face {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 4px 14px var(--shadow); padding: 20px 18px; min-height: 260px;
  display: flex; flex-direction: column; justify-content: center; text-align: center;
  transition: transform 0.16s ease-in;
}
.face.back { border-color: var(--accent); }
.face.squash { transform: scaleX(0); }
.deck-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--gold); margin-bottom: 14px; }
.q { font-size: 20px; font-weight: 700; line-height: 1.35; }
.a { font-size: 17px; line-height: 1.55; color: var(--text); }
.a b { color: var(--accent); }
.a small { color: var(--text2); font-size: 13px; }
.a table { margin: 0 auto; border-collapse: collapse; font-size: 15px; text-align: left; }
.a td { padding: 3px 8px; border-bottom: 1px solid var(--border); }
.a td:first-child { color: var(--text2); font-weight: 600; }
.a td:last-child { font-family: 'SF Mono', Menlo, monospace; color: var(--accent); font-weight: 700; }
.hint { font-size: 11px; color: var(--text3); margin-top: 16px; }

/* Buttons */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.btn {
  padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg2);
  font-size: 15px; font-weight: 700; cursor: pointer; color: var(--text);
}
.btn.again { color: var(--red); border-color: var(--red); }
.btn.got { color: #fff; background: var(--green); border-color: var(--green); }
.btn:disabled { opacity: 0.35; }
.tools { display: flex; justify-content: center; gap: 18px; margin-top: 16px; }
.link { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px; }
.toggle-row { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--text2); margin-top: 10px; }
.toggle-row input { width: 18px; height: 18px; accent-color: var(--accent); }

.done { text-align: center; padding: 40px 16px; }
.done h2 { color: var(--green); font-size: 20px; margin-bottom: 8px; }
.done p { color: var(--text2); font-size: 14px; margin-bottom: 18px; }
.footer { text-align: center; font-size: 10px; color: var(--text3); line-height: 1.5; margin-top: 24px; }
</style>
</head>
<body>
<div class="header">
  <a class="back-link" href="drug-calc.html">&#8249; Calculator</a>
  <h1>APLS Flip Cards</h1>
</div>
<div class="container">
  <div class="sub">Tap the card to flip it, then mark whether you knew it. Cards you miss come back.</div>
  <div class="chips" id="chips"></div>

  <div class="progress-row"><span id="progText"></span><span id="knownText"></span></div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>

  <div id="stage"></div>

  <div class="actions" id="actions">
    <button class="btn again" id="againBtn" disabled>Again</button>
    <button class="btn got" id="gotBtn" disabled>Got it</button>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="hideKnown"><label for="hideKnown">Skip cards I already know</label>
  </div>
  <div class="tools">
    <button class="link" id="shuffleBtn">Shuffle &amp; restart</button>
    <button class="link" id="resetBtn">Reset progress</button>
  </div>

  <div class="footer">
    Based on APLS 7th edition and RCUK 2025 Paediatric Life Support.<br>
    For revision only. Check your course manual and local guidelines.
  </div>
</div>

  ["Drug choice", "Septic shock after 40 ml/kg, cool peripheries, poor contractility.<br><small>Which vasoactive?</small>", "<b>Adrenaline</b> infusion (first-line inotrope). Peripheral or IO is fine"],
  ["Drug choice", "Septic shock after 40 ml/kg, warm and vasodilated.<br><small>Which vasoactive?</small>", "<b>Noradrenaline</b> infusion (first-line vasopressor). Peripheral or IO is fine"],
  ["Drug choice", "Shock not responding to fluids and two vasoactives.<br><small>Which drug?</small>", "<b>Hydrocortisone</b> 1–2 mg/kg IV (max 100 mg)"],
  ["Drug choice", "5-day-old, grey and shocked, weak femoral pulses.<br><small>Which drug?</small>", "<b>Prostaglandin</b> infusion (duct-dependent lesion). Watch for apnoea and be ready to ventilate"],
  ["Drug choice", "Fitting for 5 min, IV access in.<br><small>Drug and dose?</small>", "<b>Lorazepam</b> 0.1 mg/kg IV/IO (max 4 mg). Check glucose"],
  ["Drug choice", "Fitting for 5 min, no IV access.<br><small>Drug and dose?</small>", "<b>Buccal midazolam</b> 0.3 mg/kg (max 10 mg)"],
  ["Drug choice", "Still fitting after 2 benzodiazepine doses.<br><small>Drug and dose?</small>", "<b>Levetiracetam</b> 40 mg/kg over 5 min (max 3 g), or <b>phenytoin</b> 20 mg/kg over 20 min. Call an anaesthetist and PICU"],
  ["Drug choice", "Still fitting after second-line drugs.<br><small>Next step?</small>", "Give the other second-line drug, then <b>RSI</b>: ketamine 1–2 mg/kg (or thiopental) + rocuronium, and ventilate"],
  ["Drug choice", "Floppy, drowsy toddler, glucose 1.8.<br><small>Drug and dose?</small>", "<b>10% glucose</b> 3 ml/kg IV (APLS; EPALS 2 ml/kg), then an infusion. Take a hypoglycaemia screen first if you can"],
  ["Drug choice", "K+ 7.4 with peaked T waves.<br><small>Drugs?</small>", "<b>Calcium</b> to stabilise the myocardium, <b>insulin</b> 0.1 units/kg (max 10) in 10% glucose 5 ml/kg over 30 min, <b>salbutamol</b> neb"],
  ["Drug choice", "DKA: headache, falling HR, rising BP, GCS dropping.<br><small>Drug?</small>", "<b>Hypertonic saline</b> (2.7% or 3%) 3–5 ml/kg or <b>mannitol</b> 0.5–1 g/kg over 10–15 min. Restrict fluids, head up, PICU"],
  ["Drug choice", "Head injury, unequal pupils, bradycardia and hypertension.<br><small>Drug?</small>", "<b>3% saline</b> 3 ml/kg (or mannitol 0.25–0.5 g/kg). Neuroprotect, call neurosurgery"],
  ["Drug choice", "Febrile, encephalopathic child.<br><small>Which antimicrobials?</small>", "<b>Ceftriaxone</b> 80 mg/kg + <b>aciclovir</b> (dose per BNFc)"],
  ["Drug choice", "Major trauma, haemorrhagic shock, injured 1 h ago.<br><small>Which drugs and fluids?</small>", "<b>Tranexamic acid</b> 15–20 mg/kg (max 1 g), then 2 mg/kg/h. <b>Blood</b> in 10 ml/kg boluses (red cells:FFP 1:1). Crystalloid max 20 ml/kg"],
  ["Drug choice", "8-year-old with a fractured femur in severe pain, no IV access.<br><small>Analgesia?</small>", "<b>Intranasal fentanyl</b> 1.5 mcg/kg. Then IV morphine 0.1 mg/kg, a fascia iliaca block and a traction splint"],
  ["Drug choice", "Shocked child needs RSI.<br><small>Induction drugs?</small>", "<b>Ketamine</b> 1–2 mg/kg + <b>rocuronium</b> 1 mg/kg. Adrenaline push-dose ready, fluid running, atropine available"],

  // ---------- GCS ----------
  ["GCS", "AVPU or GCS: which in the APLS primary assessment?", "<b>AVPU</b> in the primary assessment (D). <b>GCS</b> in the secondary assessment, trauma and head injury"],
  ["GCS", "AVPU → approximate GCS", "A ≈ 15<br>V ≈ 13<br>P ≈ 8<br>U ≈ 3"],
  ["GCS", "GCS that means the airway needs protecting", "8 or less (AVPU of P or U)"],
  ["GCS", "Eye opening scores (all ages)", "4 Spontaneous<br>3 To voice<br>2 To pain<br>1 None"],
  ["GCS", "Verbal scores: 4 years and older", "5 Orientated<br>4 Confused<br>3 Inappropriate words<br>2 Incomprehensible sounds<br>1 None"],
  ["GCS", "Verbal scores: <b>under 4 years</b> (children's GCS)", "5 Alert, babbles, coos, words or sentences to usual ability<br>4 Less than usual ability, irritable cry<br>3 Cries inappropriately<br>2 Occasionally whimpers or moans<br>1 None"],
  ["GCS", "Motor scores: 4 years and older", "6 Obeys commands<br>5 Localises to pain<br>4 Withdraws from pain<br>3 Abnormal flexion<br>2 Extension<br>1 None"],
  ["GCS", "Motor scores: <b>under 4 years</b> (children's GCS)", "6 Normal spontaneous movements<br>5 Localises to pain, or withdraws to touch<br>4 Withdraws from pain<br>3 Abnormal flexion<br>2 Extension<br>1 None"],
  ["GCS", "Which GCS component matters most in a preverbal or intubated child?", "<b>Motor</b> response"],
  ["GCS", "Score 5 for an infant's motor response", "Withdraws to touch (an older child localises to pain)"],
  ["GCS", "Score 5 for an infant's verbal response", "Alert, babbles or coos as usual"],
  ["GCS", "Toddler: eyes open to voice, irritable cry, withdraws from pain.<br><small>GCS?</small>", "E3 V4 M4 = <b>11</b>"],
  ["GCS", "6-year-old: eyes open to pain, incomprehensible sounds, abnormal flexion.<br><small>GCS?</small>", "E2 V2 M3 = <b>7</b>. Protect the airway"],
  ["GCS", "Decorticate vs decerebrate posture", "<b>Decorticate</b> = abnormal flexion (M3)<br><b>Decerebrate</b> = extension (M2). Both are signs of raised ICP"],

  // ---------- LEADING / TIPS ----------
  ["Leading", "The anaesthetist's biggest trap as team leader", "Going to the airway. Stay at the foot of the bed, hands off, and delegate"],
  ["Leading", "When should you reassess?", "After every intervention. Go back to A"],
  ["Leading", "What should a summary contain?", "Age, weight, problem, what's been done, what's next. Repeat every few minutes and when someone arrives"],
  ["Leading", "Closed-loop communication example", "'Anna, please give 160 ml Hartmann's over 5 min and tell me when it's in'"],
  ["Leading", "Things you must not forget in every scenario", "Glucose · calling for help (senior, PICU, retrieval) · the parents · reassessment"],
  ["Leading", "Why do children desaturate fast?", "Small FRC and high O2 consumption"],
  ["Leading", "Why is bradycardia so dangerous in infants?", "Cardiac output depends on heart rate"],
  ["Leading", "Infant airway positioning", "Neutral position, with a roll under the shoulders because of the large occiput"],
];


// ---------- Theme (shared with the launcher) ----------
var theme = 'light';
try { theme = localStorage.getItem('ndanae-theme') || 'light'; } catch (e) {}
document.documentElement.setAttribute('data-theme', theme);
window.addEventListener('message', function (e) {
  if (e.data && e.data.theme) document.documentElement.setAttribute('data-theme', e.data.theme);
});
window.addEventListener('storage', function (e) {
  if (e.key === 'ndanae-theme') document.documentElement.setAttribute('data-theme', e.newValue);
});

// ---------- Storage helpers ----------
var KEY = 'ndanae-apls-known';
function loadKnown() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
function saveKnown() { try { localStorage.setItem(KEY, JSON.stringify(known)); } catch (e) {} }
var known = loadKnown();

// ---------- WETFLAG drill (generated cards) ----------
var DRILL_AGES = [
  {label: '3 months', m: 3}, {label: '6 months', m: 6}, {label: '9 months', m: 9},
  {label: '1 year', y: 1}, {label: '2 years', y: 2}, {label: '3 years', y: 3}, {label: '4 years', y: 4},
  {label: '5 years', y: 5}, {label: '6 years', y: 6}, {label: '7 years', y: 7}, {label: '8 years', y: 8},
  {label: '9 years', y: 9}, {label: '10 years', y: 10}, {label: '11 years', y: 11}, {label: '12 years', y: 12}
];
function r1(v) { return Math.round(v * 10) / 10; }
function wetflag(a) {
  var w, tube, len;
  if (a.m !== undefined) {
    w = 0.5 * a.m + 4;
    tube = a.m < 6 ? '3.0 cuffed' : '3.5 cuffed';
    len = a.m < 6 ? '10 cm' : '12 cm';
  } else {
    w = a.y <= 5 ? 2 * a.y + 8 : 3 * a.y + 7;
    var t = Math.round((a.y / 4 + 3.5) * 2) / 2;
    tube = t.toFixed(1) + ' cuffed';
    len = r1(a.y / 2 + 12) + ' cm oral';
  }
  var j = Math.round(4 * w);
  var fluid = Math.min(10 * w, 500);
  var lor = Math.min(r1(0.1 * w), 4);
  var adr = Math.min(10 * w, 1000);
  var adrMl = Math.min(r1(0.1 * w), 10);
  var glu = Math.round(3 * w);
  var formula = a.m !== undefined ? '(0.5 × ' + a.m + ') + 4' : (a.y <= 5 ? '(2 × ' + a.y + ') + 8' : '(3 × ' + a.y + ') + 7');
  return '<table>' +
    '<tr><td>W</td><td>' + r1(w) + ' kg</td></tr>' +
    '<tr><td>E</td><td>' + j + ' J</td></tr>' +
    '<tr><td>T</td><td>' + tube + ', ' + len + '</td></tr>' +
    '<tr><td>F</td><td>' + Math.round(fluid) + ' ml</td></tr>' +
    '<tr><td>L</td><td>' + lor + ' mg</td></tr>' +
    '<tr><td>A</td><td>' + Math.round(adr) + ' mcg (' + adrMl + ' ml 1:10,000)</td></tr>' +
    '<tr><td>G</td><td>' + glu + ' ml 10%</td></tr>' +
    '</table><small>Weight = ' + formula + '. Round energy to the nearest setting on your defibrillator.</small>';
}

// ---------- Build the full card list ----------
var ALL = CARDS.map(function (c, i) { return {id: 'c' + i, deck: c[0], q: c[1], a: c[2]}; });
DRILL_AGES.forEach(function (a, i) {
  ALL.push({id: 'w' + i, deck: 'WETFLAG drill', q: 'WETFLAG for a child aged<br><span style="font-size:30px;color:var(--accent)">' + a.label + '</span>', a: wetflag(a)});
});

var DECKS = ['All'];
ALL.forEach(function (c) { if (DECKS.indexOf(c.deck) < 0) DECKS.push(c.deck); });

var currentDeck = 'All';
var queue = [], total = 0, doneCount = 0, flipped = false;

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
}

function deckCards(deck) { return ALL.filter(function (c) { return deck === 'All' || c.deck === deck; }); }

function renderChips() {
  var h = '';
  DECKS.forEach(function (d) {
    var cards = deckCards(d);
    var k = cards.filter(function (c) { return known[c.id]; }).length;
    h += '<button class="chip' + (d === currentDeck ? ' active' : '') + '" data-deck="' + d + '">' + d +
      '<span class="n">' + k + '/' + cards.length + '</span></button>';
  });
  var el = document.getElementById('chips');
  el.innerHTML = h;
  el.querySelectorAll('.chip').forEach(function (b) {
    b.onclick = function () { currentDeck = this.getAttribute('data-deck'); start(); };
  });
}

function start() {
  var cards = deckCards(currentDeck);
  if (document.getElementById('hideKnown').checked) cards = cards.filter(function (c) { return !known[c.id]; });
  queue = shuffle(cards.slice());
  total = queue.length; doneCount = 0;
  renderChips(); show();
}

function show() {
  flipped = false;
  var stage = document.getElementById('stage');
  var againBtn = document.getElementById('againBtn'), gotBtn = document.getElementById('gotBtn');
  againBtn.disabled = gotBtn.disabled = true;
  updateProgress();
  if (!queue.length) {
    document.getElementById('actions').style.display = 'none';
    stage.innerHTML = '<div class="done"><h2>Deck complete</h2><p>' +
      (total ? 'You got through all ' + total + ' cards.' : 'No cards left to review in this deck.') +
      '</p><button class="btn got" id="againDeck" style="padding:12px 24px">Go again</button></div>';
    document.getElementById('againDeck').onclick = start;
    return;
  }
  document.getElementById('actions').style.display = 'grid';
  var c = queue[0];
  var frontHtml = '<div class="deck-tag">' + c.deck + (known[c.id] ? ' · known' : '') + '</div><div class="q">' + c.q + '</div><div class="hint">Tap to reveal</div>';
  var backHtml = '<div class="deck-tag">' + c.deck + '</div><div class="a">' + c.a + '</div><div class="hint">Tap to see the question</div>';
  stage.innerHTML = '<div class="card" id="card"><div class="face front" id="face">' + frontHtml + '</div></div>';
  var face = document.getElementById('face'), busy = false;
  document.getElementById('card').onclick = function () {
    if (busy) return; busy = true;
    face.classList.add('squash');
    setTimeout(function () {
      flipped = !flipped;
      face.innerHTML = flipped ? backHtml : frontHtml;
      face.classList.toggle('back', flipped);
      face.classList.toggle('front', !flipped);
      face.classList.remove('squash');
      againBtn.disabled = gotBtn.disabled = false;
      busy = false;
    }, 160);
  };
}

function updateProgress() {
  var pct = total ? Math.round(doneCount / total * 100) : 100;
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('progText').textContent = total ? (doneCount + ' of ' + total + ' done') : '';
  var all = deckCards(currentDeck);
  var k = all.filter(function (c) { return known[c.id]; }).length;
  document.getElementById('knownText').textContent = k + ' of ' + all.length + ' known';
}

document.getElementById('gotBtn').onclick = function () {
  var c = queue.shift();
  known[c.id] = 1; saveKnown(); doneCount++;
  renderChips(); show();
};
document.getElementById('againBtn').onclick = function () {
  var c = queue.shift();
  delete known[c.id]; saveKnown();
  var pos = Math.min(queue.length, 3 + Math.floor(Math.random() * 3));
  queue.splice(pos, 0, c);
  renderChips(); show();
};
document.getElementById('shuffleBtn').onclick = start;
var resetArmed = false;
document.getElementById('resetBtn').onclick = function () {
  if (!resetArmed) { resetArmed = true; this.textContent = 'Tap again to reset'; var b = this; setTimeout(function () { resetArmed = false; b.textContent = 'Reset progress'; }, 3000); return; }
  resetArmed = false; this.textContent = 'Reset progress';
  known = {}; saveKnown(); start();
};
document.getElementById('hideKnown').onchange = start;

start();
</script>
</body>
</html>
